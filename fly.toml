app = "distributed-job-platform"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.worker_main"

[env]
  API_PORT = "8000"
  ENVIRONMENT = "production"
  RATE_LIMIT_PER_MINUTE = "120"
  WORKER_CONCURRENCY = "4"
  JOB_TIMEOUT_SECONDS = "120"
  STALLED_JOB_GRACE_SECONDS = "60"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
